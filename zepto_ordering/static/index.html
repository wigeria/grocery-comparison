<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
  <title>Grocery Orders</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="link-button" id="home-button" type="button">Groceries</button>
    <div class="row">
      <button class="link-button danger-link" id="cancel-button" type="button" hidden>Cancel order</button>
      <span class="status-dot" id="status-dot" title="Checking Zepto login"></span>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <dialog id="review-dialog" class="sheet">
    <div id="review-body"></div>
  </dialog>

  <dialog id="confirm-dialog" class="sheet small">
    <p id="confirm-text"></p>
    <div class="row end">
      <button type="button" class="button ghost" id="confirm-no">Keep</button>
      <button type="button" class="button danger" id="confirm-yes">Yes</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="alert" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
