[project]
name = "zepto-ordering"
version = "0.1.0"
description = "Self-hosted app that orders Zepto groceries from chat or photos, with a Blinkit price check"
license = "MIT"
requires-python = ">=3.11"
# Exact versions for Docker builds are in requirements.lock (see README).
dependencies = [
    "claude-agent-sdk>=0.2.163,<0.3",
    "curl_cffi>=0.16,<0.17",
    "fastapi>=0.142,<1",
    "httpx>=0.28,<1",
    "httpx2>=2.13,<3",
    "mcp>=2.3,<3",
    "pillow>=12,<13",
    "python-multipart>=0.0.32,<0.1",
    "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[build-system]
# 77+ understands the SPDX `license = "MIT"` field.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zepto_ordering*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
